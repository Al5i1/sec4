<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>إنشاء حساب</title>
  <link rel="stylesheet" href="../css/main.css?v=4"/>
  <link rel="stylesheet" href="../css/register.css?v=4"/>
</head>
<body>

  <!-- ══ Top Controls Bar ══ -->
  <div class="top-bar">

    <button id="themeToggle" onclick="App.toggleTheme()" title="تبديل الوضع">🌙</button>

    <div id="langWrap">
      <button id="langToggleBtn">
        <span class="globe">🌐</span>
        <span id="langLabel">العربية</span>
        <span id="langArrow">▾</span>
      </button>

      <div id="langPanel">
        <div class="lang-featured">
          <div class="lang-pill active" data-lang="ar">العربية</div>
          <div class="lang-pill"        data-lang="en">English</div>
        </div>
        <div class="lang-sep">Languages</div>
      </div>
    </div>

  </div><!-- /top-bar -->

  <!-- ══ Register Card ══ -->
  <div class="card">

    <div class="logo">
      <div class="icon">✨</div>
      <h1 data-i18n="reg.title">إنشاء حساب جديد</h1>
      <p  data-i18n="reg.subtitle">أدخل بياناتك للتسجيل</p>
    </div>

    <form id="registerForm" novalidate>

      <!-- Name row -->
      <div class="name-row">

        <!-- First name -->
        <div class="form-group">
          <label>
            <span data-i18n="reg.firstName">الاسم الأول</span>
            <span class="note" data-i18n="reg.firstNote">(بالإنجليزية)</span>
          </label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="firstName"
                   data-i18n-ph="reg.firstPh"
                   placeholder="First Name"
                   autocomplete="given-name"
                   style="direction:ltr;text-align:left"/>
          </div>
          <div class="hint" id="hintFirst" data-i18n="reg.errName">الاسم بالإنجليزي فقط</div>
        </div>

        <!-- Last name -->
        <div class="form-group">
          <label>
            <span data-i18n="reg.lastName">الاسم الأخير</span>
            <span class="note" data-i18n="reg.lastNote">(بالإنجليزية)</span>
          </label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="lastName"
                   data-i18n-ph="reg.lastPh"
                   placeholder="Last Name"
                   autocomplete="family-name"
                   style="direction:ltr;text-align:left"/>
          </div>
          <div class="hint" id="hintLast" data-i18n="reg.errName">الاسم بالإنجليزي فقط</div>
        </div>

      </div><!-- /name-row -->

      <!-- Email -->
      <div class="form-group">
        <label data-i18n="reg.email">البريد الإلكتروني</label>
        <div class="input-wrap">
          <span class="input-icon">📧</span>
          <input type="email" id="email"
                 data-i18n-ph="reg.emailPh"
                 placeholder="example@mail.com"
                 autocomplete="email"/>
        </div>
        <div class="hint" id="hintEmail" data-i18n="reg.errEmail">أدخل بريداً إلكترونياً صحيحاً</div>
      </div>

      <!-- Phone -->
      <div class="form-group">
        <label data-i18n="reg.phone">رقم الهاتف</label>
        <div class="phone-group">
          <select id="countryCode" class="country-select" title="مفتاح الدولة">
            <option value="+973" selected>🇧🇭 +973</option>
            <option value="+966">🇸🇦 +966</option>
            <option value="+965">🇰🇼 +965</option>
            <option value="+971">🇦🇪 +971</option>
            <option value="+974">🇶🇦 +974</option>
            <option value="+968">🇴🇲 +968</option>
            <option value="+964">🇮🇶 +964</option>
            <option value="+962">🇯🇴 +962</option>
            <option value="+20">🇪🇬 +20</option>
            <option value="+961">🇱🇧 +961</option>
            <option value="+963">🇸🇾 +963</option>
            <option value="+967">🇾🇪 +967</option>
            <option value="+212">🇲🇦 +212</option>
            <option value="+213">🇩🇿 +213</option>
            <option value="+216">🇹🇳 +216</option>
            <option value="+218">🇱🇾 +218</option>
            <option value="+249">🇸🇩 +249</option>
            <option value="+90">🇹🇷 +90</option>
            <option value="+44">🇬🇧 +44</option>
            <option value="+1">🇺🇸 +1</option>
            <option value="+91">🇮🇳 +91</option>
            <option value="+92">🇵🇰 +92</option>
          </select>
          <div class="input-wrap">
            <span class="input-icon">📱</span>
            <input type="tel" id="phone"
                   data-i18n-ph="reg.phonePh"
                   placeholder="3XXXXXXX"
                   autocomplete="tel"
                   style="direction:ltr;text-align:left"/>
          </div>
        </div>
        <div class="hint" id="hintPhone" data-i18n="reg.errPhone">أدخل رقم هاتف صحيح</div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label data-i18n="reg.password">كلمة المرور</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="password"
                 data-i18n-ph="reg.passwordPh"
                 placeholder="••••••••"
                 autocomplete="new-password"/>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="hint" id="hintPass" data-i18n="reg.errPass">كلمة المرور يجب أن تكون 8 أحرف على الأقل</div>
      </div>

      <!-- Confirm -->
      <div class="form-group">
        <label data-i18n="reg.confirm">تأكيد كلمة المرور</label>
        <div class="input-wrap">
          <span class="input-icon">🔑</span>
          <input type="password" id="confirmPassword"
                 data-i18n-ph="reg.confirmPh"
                 placeholder="••••••••"
                 autocomplete="new-password"/>
        </div>
        <div class="hint" id="hintConfirm" data-i18n="reg.errConfirm">كلمتا المرور غير متطابقتين</div>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-register" data-i18n="reg.create">
        إنشاء الحساب
      </button>

      <div class="divider">
        <span data-i18n="reg.or">أو</span>
      </div>

      <div class="foot-link">
        <span data-i18n="reg.hasAccount">لديك حساب بالفعل؟</span>
        <a href="index.html" data-i18n="reg.signIn"> تسجيل الدخول</a>
      </div>

    </form>
  </div><!-- /card -->

  <script src="../js/spark_manifest.js?v=11"></script>
  <script src="../js/github_engine.js?v=11"></script>
  <script src="../js/i18n.js?v=11"></script>
  <script src="../js/app.js?v=11"></script>
  <script src="../js/auth.js?v=11"></script>
</body>
</html>
